# Test talk for milestone 1 (brief §12) and the test suite. Keep it short and valid.
talk: test
voice: chloe
presenter: Ken
slides:
  - id: title
    speaker: human
  - id: how
    speaker: relay
    plain: "Like a radio host with a script and an earpiece: the script is ready, and the producer can cut in anytime."
