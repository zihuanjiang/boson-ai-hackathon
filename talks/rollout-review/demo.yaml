# Simulated online meeting (doc/online_meeting_patch.md; contract v3.1 §1). Alice, Bob and Carol are remote
# participants with PRERECORDED clips: the page plays each clip on the speakers (the judges hear it) and streams the
# same samples to Higgs Realtime at real-time pace. The microphone is off, and the facilitator's own audio never
# reaches the Higgs input, so Alice's clip, started while the facilitator is audibly presenting, is a genuine barge-in.
# Nothing of the AI is prerecorded: the facilitator's speech, lookups, alignment check, decision and notes are live.
#   clips:    uv run python -m relay.clips talks/rollout-review   (TTS 3 with the voices below; a recording at
#             talks/rollout-review/clips/<step id>.wav, mono 16-bit 24 kHz, replaces a generated clip)
#   validate: uv run python -m relay.talk talks/rollout-review
# The `say` lines are the patch §4 example, word for word. The alignment check (checks.yaml) is tested on exactly
# these words (.scratch/same-page/patch/demo/run_patch_lines.py): Alice's line is a question (no conflict), Bob's
# line gives two conflicts with an action and no intervention, Carol's "Great, let's finalize that." opens the gate,
# and her correction resolves both conflicts with owner Bob. Change a `say` only together with that check.
# The cues are events, not a timeline; the gaps are the pauses of a real call. Each step waits for the previous one.
# A participant's line ends where the clip ends (the page flags the silence it streams after each clip), so a pause
# inside a recording never splits a line and two clips in a row never merge into one, whatever the gap.

# TTS 3 presets for the generated clips, chosen to differ from each other and from the facilitator's `default`
# (script.yaml): Alice a friendly, engaging female voice, Bob an energetic male one, Carol a calm, professional
# female one. Changing a voice regenerates that clip (the cache key is the words + the voice).
voices: {Alice: chloe, Bob: jake, Carol: eleanor}

steps:
  # Run demo starts the presentation (the same as pressing R; disclosed). A no-op if it is already running.
  - id: start
    action: start
    when: {phase: presentation}

  # The interruption (patch §4 A; brief §13 0:20). The facilitator has presented Friday = beta (friday-beta) and
  # Wednesday = production, and is 1.5 s into the rollback plan, live ("Next, the rollback plan…"): Alice cuts in.
  # The backend hears her in the clip stream, cuts the facilitator (truncated to what was heard), and takes her turn:
  # lookup_evidence → a live answer from REQ-2/REQ-3 → resume at rollback-trigger.
  - id: alice-question
    speaker: Alice
    say: "Wait, I thought Friday was production. Which one is it?"
    when: {talking_point: rollback-trigger, heard_ms: 1500}

  # The discussion (patch §4 B). After the facilitator's hand-over line, a 1.5 s pause, then Bob. The facilitator
  # stays silent: the conflict is on screen as chips, but nobody has confirmed anything yet.
  - id: bob-announce
    speaker: Bob
    say: "I'll announce Friday's production launch to all customers."
    when: {phase: discussion, quiet_ms: 1500}

  # Carol agrees a second later: the confirmation opens the gate, and the facilitator asks one clarification, live.
  - id: carol-finalize
    speaker: Carol
    say: "Great, let's finalize that."
    when: {after: bob-announce, gap_ms: 1000}

  # Carol answers the facilitator's question once it has played, after a short beat.
  - id: carol-correct
    speaker: Carol
    say: "Yes, beta users only. Bob owns the announcement."
    when: {after_reply: intervention, gap_ms: 800}

  # Once the facilitator has confirmed the decision ("Confirmed. I've updated the action items."), the script presses
  # Wrap up (disclosed, the same as clicking the agenda button) and the facilitator sums up from the notes. Live, the
  # decision often comes as a silent save_decision call and then a spoken confirmation (its own reply): so the cue
  # also waits for the room to be quiet 2 s (back to listening, nothing playing), never cutting the confirmation.
  - id: wrap
    action: phase
    when: {after_reply: decision, phase: discussion, quiet_ms: 2000}
