# On the Same Page: the demo meeting (doc/brief_updated.md §2, §3, §13; contract §8). A fictional team reviews the
# release 4.3 rollout: Alice (product manager, host), Bob (customer communications), Carol (engineering lead).
#   validate: uv run python -m relay.talk talks/rollout-review     render: uv run python -m relay.render talks/rollout-review
# The `say` lines do two jobs. They are the facilitator's talking points: Higgs Realtime presents one talking point
# per response, live, in its own words (the chunk `id` is the talking point id on screen and in the checkpoint). They
# are also the backup narration: TTS 3 renders them word for word for when Realtime is down. So: whole sentences,
# at most 300 characters per `say`, numbers spelled as words, no digits, URLs, parentheses or acronyms.
# Keep the facts in step with sources/*.md (the evidence the facilitator cites): Friday the twenty-fourth = beta to
# the beta group, about forty customers (REQ-2); production Wednesday the twenty-ninth after the beta exit review
# (REQ-3, REQ-4); rollback trigger and call (REQ-5, REQ-6); announcements follow the stage (DEC-2); Bob owns
# customer communications (DEC-3). The talking points never answer Alice's question in advance beyond REQ-2/REQ-3:
# the answer must come from lookup_evidence, live.
# The talking points are about fifty seconds of speech; with the greeting, the answer and the hand-over the
# facilitator presents for about seventy (brief §13: the whole video is two to three minutes).
# CUE comments mark the live moments. The participants are prerecorded clips (online-meeting patch): their words and
# cues are in demo.yaml, the walkthrough in run_of_show.md.
talk: rollout-review
voice: default        # D54: lowest latency, never voice-validated; re-render after any change to a `say`
presenter: Alice      # the host (agenda.yaml)
slides:
  - id: agenda
    speaker: human    # demo.yaml step `start` (Run demo, = R) starts the presentation from here

  - id: plan
    speaker: relay
    plain: "Like a restaurant's soft opening: a small group of regulars tries the new menu on Friday, and the doors open to everyone on Wednesday if it goes well."
    chunks:
      # Brief §3: "Friday's rollout is for our beta group." The first talking point of the meeting.
      - id: friday-beta
        say: "Release four point three ships in two stages. Friday's rollout is for our beta group: about forty customers who opted in to early access."
        fragment: 1
      - id: wednesday-production
        say: "Production follows on Wednesday the twenty-ninth for all customers, but only if Tuesday's beta exit review gives the green light."
        fragment: 2

  - id: rollback
    speaker: relay
    plain: "Like a smoke alarm with a clear threshold: if errors cross the line, Carol pulls the alarm and everyone is back on the old version within the hour."
    chunks:
      # CUE (interruption, brief §13 0:20; demo.yaml `alice-question`): 1.5 s into this point, live, Alice's clip
      # barges in: "Wait, I thought Friday was production. Which one is it?" -> lookup_evidence -> answer from
      # REQ-2/REQ-3 -> resume HERE (status `resuming`), not at the start of `plan`.
      - id: rollback-trigger
        say: "Next, the rollback plan. If the beta runs into trouble, with an error rate above two percent for thirty minutes or any data loss at all, we roll back."
        fragment: 1
      - id: rollback-call
        say: "Carol makes that call as engineering lead, and we are back on release four point two within an hour."
        fragment: 2

  - id: comms
    speaker: relay
    plain: "Like sending invitations in two waves: the beta group hears on Friday, and everyone else hears when the doors open on Wednesday."
    chunks:
      - id: beta-notes
        say: "Announcements follow the stage. On Friday, release notes go to the beta group only."
        fragment: 1
      # After this point drains: the hand-over (one live sentence), then the discussion phase (the facilitator
      # listens to the participant clips; demo.yaml `bob-announce` follows 1.5 s later).
      - id: customer-announcement
        say: "The customer-wide announcement goes out with production on Wednesday, and Bob owns customer communications for both."
        fragment: 2

  - id: discussion
    speaker: human    # agenda.yaml discussion_slide: shown while the facilitator listens to the room
