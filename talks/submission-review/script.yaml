# On the Same Page introduces itself (contract v4 §2). The team meets before submitting to the hackathon: Alice
# (project lead, host), Bob (writes the submission), Carol (engineering lead). The facilitator presents what was
# built: background, the pipeline, the live results, the limitations; the team then discusses which limitations go
# in the write-up.
#   validate: uv run python -m relay.talk talks/submission-review   render: uv run python -m relay.render talks/submission-review
# The `say` lines do two jobs. They are the facilitator's talking points: Higgs Realtime presents one talking point
# per response, live, in its own words (the chunk `id` is the talking point id on screen and in the checkpoint). They
# are also the backup narration: TTS 3 renders them word for word for when Realtime is down. So: whole sentences,
# at most 300 characters per `say`, numbers spelled as words, no digits, URLs, parentheses or acronyms ("Higgs
# Realtime", "text to speech", never "TTS"). And every line must stay true while the backup plays it: never "what I
# am saying now is live"; the lookups, the alignment check, the decisions and the notes are live either way.
# Keep the facts in step with sources/*.md (the evidence the facilitator cites) and with doc/gotchas.md (the
# 2026-10-24 live runs): one Realtime session, talking points from notes (DES-1); cut, trim, lookup, answer with the
# source, resume (DES-3, DES-4); listen, compare, speak only before a confirmation, save the decision (DES-5..10);
# the measured numbers (RES-1..3; the 8/8 checks and the 1,600 tests of RES-4 stay on the slide, see `live-numbers`);
# English only, documents only, a model's judgement that is verified but not guaranteed (LIM-1, LIM-5, LIM-6, LIM-8); online meetings, a shared microphone
# needs echo cancellation before hands-free in-person use (LIM-2, LIM-3; one stream per participant and no speaker
# identification, LIM-4, stay on the slide). The talking points never answer Alice's question in advance beyond what
# `limits-room` says later: the answer must come from lookup_evidence, live, during `interrupt-answer`.
# About 175 words in nine talking points, one sentence each. Live 2026-10-24 (first run, 211 words) the model said
# about 1.4× its notes and the discussion opened at 2:50, so the whole run was ~3.5 min: too long for a 2–3 min video
# and for Ken's "short". With one sentence per point and the "no examples, emphasis or ids" line in the talking-point
# prompt, the presentation should run ~1:45 and the whole demo under three minutes; re-time after the next live run.
# tests/test_submission_review.py bounds the total at 220 words; every number is on the slides, so no say line has
# to carry one.
# CUE comments mark the live moments. The participants are prerecorded clips (online-meeting patch): their words and
# cues are in demo.yaml, the walkthrough in run_of_show.md.
talk: submission-review
voice: default        # D54: lowest latency, never voice-validated; re-render after any change to a `say`
presenter: Alice      # the host (agenda.yaml)
slides:
  - id: agenda
    speaker: human    # demo.yaml step `start` (Run demo, = R) starts the presentation from here

  - id: background
    speaker: relay
    plain: "Like a friend who read the plan before the meeting and quietly taps your shoulder when what everyone just agreed to is not what the plan says."
    chunks:
      # The problem the brief opens with: apparent agreement becoming a mistaken decision (brief §1).
      - id: problem
        say: "Meetings end in apparent agreement: nobody checks the document, and a mistake becomes a decision."
        fragment: 1
      - id: idea
        say: "On the Same Page presents, answers from the documents, listens, and speaks up only before a decision contradicts them."
        fragment: 2

  - id: pipeline
    speaker: relay
    plain: "Like one phone call that never hangs up: the same line carries the talk, the questions and the listening, and a recording is ready in case the line drops."
    chunks:
      # True whether Realtime or the backup is speaking: it describes the design, not this moment.
      - id: one-session
        say: "One Higgs Realtime session carries the whole meeting, presenting from short notes, with a text to speech backup."
        fragment: 1
      # CUE (interruption, brief §13 0:20; demo.yaml `alice-question`): 1.5 s into this point, live, Alice's clip
      # barges in: "Wait, does this work in a normal meeting room with just one microphone?" -> lookup_evidence ->
      # answer from LIM-2/LIM-3 -> resume HERE (status `resuming`), not at the start of `pipeline`. The point itself
      # describes what the room is about to see happen.
      - id: interrupt-answer
        say: "A question stops the facilitator mid-sentence; it looks the answer up, shows the source on screen, and resumes where it stopped."
        fragment: 2
      - id: listen-check
        say: "In the discussion it speaks up only when a claim that contradicts the documents is about to be confirmed, then saves the decision with its owner."
        fragment: 3

  - id: results
    speaker: relay
    plain: "Like a stopwatch next to the demo: how fast it stops, how fast it answers, how fast it speaks up, and how many checks it passes."
    chunks:
      # The numbers are doc/gotchas.md, 2026-10-24 ~00:30 (RES-1..3): cut ~0.2 s after the clip starts, end of
      # speech -> first audio ~1.0 s, the clarification 0.3-0.5 s after the confirming line. Spelled as words; the
      # slide carries the digits. The 8/8 live checks (RES-4) were measured on the rollout-review demo, twice; this
      # package's own live check has not run yet, so the say line does not claim them: the slide says "8/8 checks
      # (first demo)" and RES-4 names the rollout review. (Dropping that sentence also saved nine words.)
      - id: live-numbers
        say: "Measured live: it stops within a fraction of a second, answers about a second after the question ends, and clarifies within half a second of a confirmation."
        fragment: 1
      # Disclosure (patch §5): true whether Realtime or the TTS backup is speaking. Keep the word "prerecorded".
      - id: what-is-live
        say: "Alice, Bob and Carol are prerecorded; the slides and documents were prepared. The lookups, checks, decisions and notes happen during the meeting."
        fragment: 2

  - id: limits
    speaker: relay
    plain: "Like a product label that lists what is not in the box: one language, the documents you gave it, a judgement that is checked but not guaranteed, and a call where each voice arrives on its own line."
    chunks:
      - id: limits-scope
        say: "The limits: English only, answers only from the documents, and the alignment check is a model's reading of the discussion: it cites verified evidence, but it can still miss a conflict or ask one question too many."
        fragment: 1
      # After this point drains: the hand-over (one live sentence), then the discussion phase (the facilitator
      # listens to the participant clips; demo.yaml `bob-claim` follows 1.5 s later). LIM-2/LIM-3, never as a
      # Higgs defect (patch §2). "Hands-free": the README's `--input mic` tap-to-talk mode runs in a room today; it is
      # hands-free operation with one shared microphone that needs echo cancellation (D56). "One stream per
      # participant" and "no speaker identification" (LIM-4) stay on the slide.
      - id: limits-room
        say: "It is built for online meetings: a shared microphone would also hear the facilitator, so hands-free in-person meetings need echo cancellation first."
        fragment: 2

  - id: discussion
    speaker: human    # agenda.yaml discussion_slide: shown while the facilitator listens to the room
