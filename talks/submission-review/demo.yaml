# Simulated online meeting (doc/online_meeting_patch.md; contract v4 §5). Alice, Bob and Carol are remote participants
# with PRERECORDED clips: the page plays each clip on the speakers (the judges hear it) and streams the same samples to
# Higgs Realtime at real-time pace. The microphone is off, and the facilitator's own audio never reaches the Higgs
# input, so Alice's clip, started while the facilitator is audibly presenting, is a genuine barge-in.
# Nothing of the AI is prerecorded: the facilitator's speech, lookups, alignment check, decision and notes are live.
#   clips:    uv run python -m relay.clips talks/submission-review   (TTS 3 with the voices below; a recording at
#             talks/submission-review/clips/<step id>.wav, mono 16-bit 24 kHz, replaces a generated clip)
#   validate: uv run python -m relay.talk talks/submission-review
# The alignment analysis (relay/semantic.py, Claude) reads these lines in context: Alice's line is a question (no
# issue), Bob's line conflicts with the documents' online-only scope but nobody has confirmed it (silent), Carol's
# "Great, let's finalize that." is the confirmation that lets the facilitator ask, and her correction resolves it with
# owner Bob. The legacy regex check (checks.yaml, `--alignment legacy`) is tested on exactly these words
# (.scratch/same-page/intro/content/run_intro_lines.py); change a `say` only together with that check.
# The cues are events, not a timeline; the gaps are the pauses of a real call. Each step waits for the previous one.
# A participant's line ends where the clip ends (the page flags the silence it streams after each clip), so a pause
# inside a recording never splits a line and two clips in a row never merge into one, whatever the gap.

# TTS 3 presets for the generated clips, chosen to differ from each other and from the facilitator's `default`
# (script.yaml): Alice a friendly, engaging female voice, Bob an energetic male one, Carol a calm, professional
# female one. Changing a voice regenerates that clip (the cache key is the words + the voice).
voices: {Alice: chloe, Bob: jake, Carol: eleanor}

steps:
  # Run demo starts the presentation (the same as pressing R; disclosed). A no-op if it is already running.
  - id: start
    action: start
    when: {phase: presentation}

  # The interruption (brief §13 0:20), inside the methodology: the facilitator has presented the background and
  # `one-session`, and is 1.5 s into `interrupt-answer`, live ("When a question comes in, the facilitator—"): Alice
  # cuts in with the question the limits slide would answer later. The backend hears her in the clip stream, cuts
  # the facilitator (truncated to what was heard), and takes her turn: lookup_evidence → a live answer from
  # LIM-2/LIM-3 (online meetings; a shared microphone needs echo cancellation, future work) → resume at
  # interrupt-answer. The answer is recorded as CL-1 and establishes "online" for the discussion.
  - id: alice-question
    speaker: Alice
    say: "Wait, does this work in a normal meeting room with just one microphone?"
    when: {talking_point: interrupt-answer, heard_ms: 1500}

  # The discussion: which limitations go in the write-up. After the facilitator's hand-over line, a 1.5 s pause, then
  # Bob claims the opposite of LIM-2 and CL-1. The facilitator stays silent: the conflict is on screen as a chip, but
  # nobody has confirmed anything yet.
  # Its own timeout (3 min, not the default 90 s): the clock starts when Alice's clip ends, and the facilitator still
  # has to answer her, resume, and present six talking points (~190 words of notes at ~0.44 s per word in the live
  # runs, plus the hand-over and the quiet) before the discussion opens: ≈ 100 s. With 90 s the strip would say
  # "waiting" and the live check would play Bob into the presentation as a barge-in.
  - id: bob-claim
    speaker: Bob
    say: "I'll write that it works for in-person meetings too, as long as there's a microphone in the room."
    when: {phase: discussion, quiet_ms: 1500, timeout_ms: 180000}

  # Carol agrees a second later: the confirmation opens the gate, and the facilitator asks one clarification, live,
  # citing LIM-2 and the answer it gave Alice (CL-1). (1 s is a natural pause; the line ends where the clip ends, so
  # the gap cannot merge the two lines.)
  - id: carol-finalize
    speaker: Carol
    say: "Great, let's finalize that."
    when: {after: bob-claim, gap_ms: 1000}

  # Carol answers the facilitator's question once it has played, after a short beat: the correction, and the owner.
  - id: carol-correct
    speaker: Carol
    say: "Yes, online meetings only. Bob owns the write-up."
    when: {after_reply: intervention, gap_ms: 800}

  # Once the facilitator has confirmed the decision ("Noted: online meetings only; Bob owns the write-up."), the
  # script presses Wrap up (disclosed, the same as clicking the agenda button) and the facilitator sums up from the
  # notes. Live, the decision often comes as a silent save_decision call and then a spoken confirmation (its own
  # reply): so the cue also waits for the room to be quiet 2 s (back to listening, nothing playing), never cutting
  # the confirmation.
  - id: wrap
    action: phase
    when: {after_reply: decision, phase: discussion, quiet_ms: 2000}
