# What the alignment check extracts (contract v4 §4; contract v3 §3.3). Every pattern is a Python regex, matched
# case-insensitively on one clause (the text is split at . ! ? ; and " but "). The same patterns run over the source
# statements, the clarifications recorded in the meeting and every discussion utterance, so the sources must establish
#   meeting_setting = online   from LIM-2 alone (LIM-3 and every other statement yield nothing).
# Checked with .scratch/same-page/intro/content/run_intro_lines.py (the demo.yaml lines plus a battery of variants) and
# .scratch/same-page/intro/apply/scenario.py (the review's answer, decoy and spelling batteries); tests/test_submission_review.py
# keeps the same expectations.
#
# The one slot has no `context`: its values are specific enough (online, remote, in-person, meeting room, hybrid),
# and a context word would only lose the facilitator's own answer to Alice when it is phrased tersely ("Online only.").
#
# Why the odd-looking in_person patterns: in_person fires only on a CAPABILITY claim, never on a bare mention.
# - The discussion is literally about which limitations go in the write-up, so the true sentences mention the
#   in-person case all the time ("I'll write that in-person meetings are a limitation", "the meeting room case is
#   future work"), and so does the facilitator's own answer to Alice, which is recorded as CL-1 and can OVERRIDE the
#   sources if it asserts exactly one value. A mention-based pattern made those answers establish in_person (silencing
#   the whole discussion) and made the true limitation sentences conflicts (a false intervention). So the value needs a
#   capability word: "works / runs / fine / usable / supports / handles" within four words BEFORE the in-person or
#   room mention (first pattern: "works for in-person meetings", "work in a normal meeting room", "runs fine in a
#   meeting room"), or the mention followed within four words by "too / as well / works / fine / supported" (second
#   pattern: "in-person meetings work too", "it's for in-person meetings too").
# - Negation still works through the normal window: "doesn't work in a normal meeting room" is a negated in_person
#   claim ("n't" within three words before the match, which starts at "work"); Alice's "does this work in a normal
#   meeting room" is a question claim. "would / could / might / will / to" right before the capability word, or "not /
#   never / no / nor / online / remote / future / to" between it and the mention, stop the first pattern ("would work
#   in a meeting room only with echo cancellation", "fine to list in-person meetings as a limitation").
# - The separators are whitespace only (`\s+`), so a comma breaks the join ("Fine, in-person is a limitation"); and
#   "limitation(s) / limited / scope / stretch" may not stand between the mention and "too / as well" ("in-person
#   meetings are a limitation too"). "also" is deliberately NOT a terminal: "in-person meetings also need echo
#   cancellation" describes the limitation; "also works in a meeting room" still fires through the first pattern.
# - In the second pattern the negator comes AFTER the mention, where the engine's three-word look-back cannot see it,
#   so "not / cannot / isn't / aren't / doesn't…" may not stand between the mention and the terminal either: "a normal
#   meeting room isn't supported yet" asserts nothing (the first pattern handles "isn't supported in a meeting room",
#   whose negator precedes the match).
# - Apostrophes are written [’'] because speech-to-text may return curly ones ("I’ll", "there’s").
# - "shared microphone", "one microphone", "room mic" are NOT in_person values: the facilitator's answer and the
#   `limits-room` talking point mention them while explaining the online-only design.
# - "offline" is NOT an in_person value: RES-4 talks about the offline test suite.
# - online also matches the speech-to-text spelling "on line" / "on-line" ("Yes, on line meetings only."), but not
#   "on line three".
# Consequence for CL-1: an answer that names online meetings keeps CL-1 behind the established value; an answer that
# only describes the limitation ("The in-person case is a limitation of this submission.") asserts nothing, so the
# sources alone (LIM-2) establish online and the alignment card cites LIM-2 only. No plausible answer establishes
# in_person any more (38 phrasings checked: 28 keep CL-1, 10 assert nothing).
slots:
  - id: meeting_setting
    label: "Where it works"
    values:
      online:
        - '\bon[- ]?line\b(?!\s+(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b)'
        - '\bremote(ly)?\b'
        - '\bvideo (calls?|meetings?|conferenc(e|ing))\b'
        - '\bconference calls?\b'
        - '\bvirtual meetings?\b'
        - '\bzoom\b'
        - '\bgoogle meet\b'
        - '\b(digital|separate|own|individual) (audio |digital )?streams?\b'
      in_person:
        - '(?<!would )(?<!could )(?<!might )(?<!will )(?<!to )\b(?:works?|working|worked|runs?|running|fine|usable|supports?|supported|handles?)\b\s+(?:(?!(?:not|never|no|nor|online|remote|future|to)\b)[\w’'']+\s+){0,4}?(?:in[- ]person|face[- ]to[- ]face|hybrid|(?:meeting|conference|same|physical) rooms?)\b'
        - '\b(?:in[- ]person|face[- ]to[- ]face|hybrid|(?:meeting|conference|same|physical) rooms?)\b\s+(?:(?!(?:not|never|no|nor|cannot|\w+n[’'']t|online|remote|future|would|could|might|will|limitations?|limited|scope|stretch)\b)[\w’'']+\s+){0,4}?\b(?:too|as well|works?|fine|supported)\b'

# A conflict counts as consequential when its utterance (or the confirming one) commits to doing something: here
# writing, saying or claiming something in the submission. "write-up" (the noun) is not an action; "write up" is.
actions:
  - '\bi[’'']ll\b'
  - '\bi will\b'
  - '\bwe[’'']ll\b'
  - '\bwe will\b'
  - '\blet[’'']?s\b'
  - '\blet us\b'
  - '\bwrite\b(?!-up)'
  - '\bsay\b'
  - '\btell\b'
  - '\bput\b'
  - '\bclaim'
  - '\bsubmit\b'
  - '\bdraft'
  - '\bsend'
  - '\bannounc'
  - '\bpublish'
  - '\bemail'
  - '\bgo(es)? out\b'

# The group is about to commit: the gate opens when one of these follows a consequential conflict.
confirmations:
  - '\bsounds (good|great|right)\b'
  - '\bfinali[sz]e'
  - '\bagreed\b'
  - '\bconfirm'
  - '\bgo ahead\b'
  - '\bthat works\b'
  - '\block (it|that|this) in\b'
  - '\bsigned off\b'

# Who takes the follow-up ("Bob owns the write-up").
ownership:
  - '\bowns?\b'
  - '\bowner\b'
  - '\bwill (draft|send|write|own|handle|take)'
  - '[’'']ll (draft|send|write|own|handle|take)'
  - '\b(is|[’'']s) on it\b'
  - '\btakes? (it|that|this)\b'
  - '\bin charge of\b'
  - '\bresponsible for\b'
  - '\bwrites (it|that|this|the)\b'

window_utterances: 3
