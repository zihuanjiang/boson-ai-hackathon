# The online meeting, unattended: Alice, Bob and Carol are prerecorded clips (Higgs TTS 3 voices, `relay.clips`).
# Alice interrupts the point that promises it ("Interrupt me, and I stop mid-sentence"); the answer comes from ZOOM-3
# and ZOOM-2 and is recorded as CL-1. In the discussion Bob plans the opposite of CL-1 (raised hands), Carol confirms,
# the facilitator asks one question, Carol corrects it and names the owner. The run of show for real people is
# run_of_show.md; the cues are web/js/demo.js's (contract v3.1).
voices: {Alice: chloe, Bob: jake, Carol: eleanor}
steps:
  - id: start
    action: start
    when: {phase: presentation}
  - id: alice-question
    speaker: Alice
    say: "Sorry, quick question: in Zoom, can people raise a hand to interrupt you?"
    when: {talking_point: interrupt, heard_ms: 1500}
  # Bob's clock starts when Alice's clip ends, and seven talking points and the hand-over come first (~90 s live).
  - id: bob-plan
    speaker: Bob
    say: "For the demo with real people, I'll tell everyone to raise a hand in Zoom and wait to be called on."
    when: {phase: discussion, quiet_ms: 1500, timeout_ms: 180000}
  - id: carol-confirm
    speaker: Carol
    say: "Sounds good. Let's lock that in."
    when: {after: bob-plan, gap_ms: 900}
  - id: carol-correct
    speaker: Carol
    say: "Right, no hands then. People just speak up, and Bob owns the briefing."
    when: {after_reply: intervention, gap_ms: 300}
  - id: wrap
    action: phase
    when: {after_reply: decision, phase: discussion, quiet_ms: 2000}
