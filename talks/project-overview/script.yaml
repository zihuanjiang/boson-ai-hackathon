# On the Same Page presents itself to the hackathon room (D88). Claude wrote this script; Higgs Realtime performs it
# live, one talking point per response. Every talking point has a `guide`: its job for the listener (intent), the bridge
# in, its beats (verbatim lines that must land exactly, or a gist with key phrases), delivery, length, what to avoid.
# `say` is the Higgs TTS 3 backup line (what plays when the link is down); it is left out where every beat is verbatim,
# and the beats joined are then the backup.
#
# Spoken rules for every line, live or backup: numbers as words; no source ids, URLs or acronyms read aloud ("text to
# speech", never TTS; "Boson AI" is the one exception, a name); every line stays true while the backup plays it (the
# answers, lookups, checks and notes are live either way; never "what you hear is live"). Pause and pace come from
# punctuation and the delivery notes: there is no SSML. Facts: talks/project-overview/sources/ and doc/gotchas.md.
talk: project-overview
voice: default
presenter: Alice
slides:
  - id: hook
    speaker: relay
    plain: "Like the first minute of a pitch: put the room inside the story before the product has a name."
    chunks:
      - id: hook
        say: "Imagine you're an engineer, up since yesterday morning, building a hackathon project for Boson AI. Round after round: a new feature, a bug hunt, one more take of the demo. Now you present it to a tired room. Frustrated? Out of words? Then let me take it from here."
        guide:
          intent: put the tired room inside the story, so the problem is theirs before the product has a name
          seconds: 25
          delivery: a storyteller, close and unhurried; the lines carry the pauses
          beats:
            - verbatim: "Imagine you're an engineer, up since yesterday morning, building a hackathon project for Boson AI."
              delivery: slow and warm, like the start of a story
            - verbatim: "Round after round: a new feature, a bug hunt, one more take of the demo."
              delivery: quicker, a light beat on each item
            - verbatim: "And now you have to present it, to a room as tired as you are."
              delivery: slower again, then a short silence
            - verbatim: "Frustrated? Out of words? Dreading the one question you can't answer?"
              delivery: three short questions, a pause after each
            - verbatim: "Then let me take it from here."
              delivery: a lift in energy, warm and sure
          avoid: a greeting before the first line, any word added to the lines

  - id: name
    speaker: relay
    plain: "Like a good chair for a meeting: it runs the agenda, answers what it can, and notices when people talk past each other."
    chunks:
      - id: name
        guide:
          intent: name the product as the answer to the hook, and promise its three moves
          bridge: straight on from the hook's last line, as its answer
          seconds: 8
          beats:
            - verbatim: "I'm On the Same Page, a meeting facilitator built on Higgs Audio."
              delivery: bright, a small lift on the name
            - verbatim: "I present, I answer, and then I listen."
              delivery: three steady steps, slowing on the last one

  - id: problem
    speaker: relay
    plain: "Like a group dinner where everyone agrees on the restaurant, and nobody checks it is closed on Mondays."
    chunks:
      - id: nods
        fragment: 1
        guide:
          intent: turn from presenting to the harder half, the discussion, where tired agreement comes cheap
          bridge: from the promise to listen to why listening matters
          seconds: 5
          beats:
            - verbatim: "Because the hard part comes after the slides."
              delivery: lower and slower
            - verbatim: "Everyone nods. Everyone agrees."
              delivery: two short beats, a little dry
      - id: apparent
        fragment: 2
        guide:
          intent: land the problem in one line the room will remember
          bridge: after a breath, the turn
          seconds: 8
          beats:
            - verbatim: "And the plan they agree on contradicts the documents nobody opened."
              delivery: steady, weight on contradicts
            - verbatim: "That's how a meeting ends in apparent agreement."
              delivery: quiet, like a punchline, then a pause
          avoid: naming any real team or meeting

  - id: present
    speaker: relay
    plain: "Like a presenter with an earpiece: it keeps to the script, takes a question, and finds its place again."
    chunks:
      - id: one-session
        fragment: 1
        guide:
          intent: show Higgs Realtime as the performer and Claude as the scriptwriter
          bridge: from the problem to the first half of the answer, presenting
          seconds: 8
          beats:
            - verbatim: "The whole meeting runs on one Higgs Realtime session, one talking point at a time, from a script Claude wrote."
              delivery: clear and confident, a small smile on the last words
      - id: interrupt
        fragment: 2
        say: "Interrupt me, and I stop mid-sentence. I look the answer up, show the source on screen, and pick up where I was cut."
        guide:
          intent: promise the interruption, the cited answer and the resume, right before someone tests it
          seconds: 9
          beats:
            - verbatim: "Interrupt me, and I stop mid-sentence."
              delivery: crisp, a tiny pause after it
            - gist: I look the answer up, show the source on screen, and pick up where I was cut, not from the top
              phrases: [the source on screen, where I was cut]
              delivery: brisk, one breath

  - id: listen
    speaker: relay
    plain: "Like a note taker who also knows the files: quiet, until the notes and the files disagree."
    chunks:
      - id: listen
        say: "When the slides end, I listen: Higgs speech to text writes down every line, and Claude checks it for a conflict with the documents, a hidden disagreement, or a detail nobody settled. I speak up only as you're about to confirm, with one neutral question."
        guide:
          intent: open the second half, listening; say who does what, the three kinds of issue, the restraint and the notes
          bridge: from presenting to the moment the slides end and the room starts talking
          seconds: 20
          beats:
            - verbatim: "When the slides end, I listen: Higgs speech to text writes down every line, and Claude checks each one for three things."
              delivery: slower and calmer
            - verbatim: "A conflict with the documents, a hidden disagreement, a detail nobody settled."
              delivery: count them off, evenly
            - verbatim: "I speak up only as you're about to confirm, with one neutral question, and the decision goes into the notes."
              delivery: calm, weight on about to confirm, warm at the end

  - id: online
    speaker: relay
    plain: "Like a colleague who dials in: a face in the grid, heard by everyone, interrupted like anyone."
    chunks:
      - id: zoom
        guide:
          intent: place it in a real online meeting, and say honestly how a demo can run without people
          seconds: 11
          beats:
            - verbatim: "And I work where meetings happen now: online, as my own participant in Zoom."
              delivery: brisk, lighter
            - verbatim: "For a repeatable demo, the participants can be prerecorded, voiced by text to speech."
              delivery: friendly and matter of fact
          avoid: saying the participants in this room are recorded or real, since either can be true

  - id: results
    speaker: relay
    plain: "Like a lab notebook: what ran for real, and what the stopwatch said."
    chunks:
      - id: measured
        guide:
          intent: prove it is real, with two facts the room can hold on to
          bridge: from how it works to what is real
          seconds: 11
          delivery: confident; slow down on the numbers
          beats:
            - verbatim: "Every answer, lookup, check and note is live."
              delivery: one beat per item
            - verbatim: "I start answering about seven tenths of a second after you stop, and both demo meetings passed every live check."

  - id: limits
    speaker: relay
    plain: "Like the small print, read out loud for once."
    chunks:
      - id: limits-scope
        fragment: 1
        guide:
          intent: say plainly where it does not work yet, without apology
          bridge: from the numbers to the honest part
          seconds: 9
          beats:
            - verbatim: "Now the honest part."
              delivery: plain and slower, a short pause after it
            - verbatim: "I'm built for online meetings: a room microphone would also hear me."
            - verbatim: "And for now, I speak English only."
      - id: limits-check
        fragment: 2
        guide:
          intent: be honest about the check, with its measured score
          seconds: 8
          delivery: plain, no apology
          beats:
            - verbatim: "Claude's check matched forty-seven of fifty-three labelled lines: a judgement, not a proof."
            - verbatim: "And the question takes a few seconds."

  - id: discussion
    speaker: human

# The hand-over to the discussion (its own response after the last talking point).
handover:
  intent: give the floor to the room, name the question, and make the listening visible
  bridge: from the limits, the meeting turns to the room
  seconds: 11
  beats:
    - verbatim: "That's the project. Now it's your turn."
      delivery: warm, a beat after it
    - gist: the question on the screen, how we run the demo with real people and who sets it up
      phrases: [real people]
    - verbatim: "I'll stay quiet and listen, and speak up only if a decision doesn't match the documents."
      delivery: calm, a slight smile
