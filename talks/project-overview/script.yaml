# Alice (AI co-host) presents On the Same Page in a Zoom call. Claude wrote this script before the meeting; Higgs
# Realtime performs it live, one talking point per response. Every talking point has a `guide`: its job for the
# listener (intent), its beats (verbatim lines that must land exactly, or a gist with key phrases), delivery, length,
# what to avoid, and, where a cut is staged, the prepared `resume` line that picks it up. A `bridge` is the
# performer's own words, so it goes only before a gist. Everything is live: there is no recorded backup (a point
# Higgs Realtime can't speak pauses the meeting until the host presses P). `say` is the talking point's plain text
# (shown and logged); where every beat is verbatim it is left out and the beats joined are the text.
#
# Spoken rules for every line: numbers as words; no source ids, URLs or acronyms read aloud ("Boson AI" is the one
# exception, a name). Pause and pace come from punctuation and the delivery notes: there is no SSML. Facts:
# talks/project-overview/sources/ and doc/gotchas.md. Length: ~245 words at ~2.6 words a second (the guides add up to
# ~1:45; RELAY_PACE, default 1.15, shortens each live point). The run with real people: run_of_show_people.md.
talk: project-overview
voice: default
presenter: Ken
slides:
  - id: hook
    speaker: relay
    plain: "Like the first minute of a pitch: put the room inside the story before the product has a name."
    chunks:
      - id: hook
        say: "Imagine you're an engineer, up since yesterday morning, building a hackathon project for Boson AI. Feature after feature, bug after bug, one more take of the demo. In an hour, you present it to a tired room. Frustrated? Nervous? Then let me take it from here."
        guide:
          intent: put the tired room inside the story, so the problem is theirs before the product has a name
          seconds: 25
          delivery: a lively storyteller at a brisk pace; short pauses only
          beats:
            - verbatim: "Imagine you're an engineer, up since yesterday morning, building a hackathon project for Boson AI."
              delivery: warm, like the start of a story, keeping it moving
            - verbatim: "Feature after feature, bug after bug, one more take of the demo."
              delivery: quicker, a light stress on each item
            - verbatim: "And in an hour, you present it, to a room as tired as you are."
              delivery: a touch of weight, then a brief pause
            - verbatim: "Are you frustrated? Nervous? Dreading the one question you can't answer?"
              delivery: three quick questions, a brief pause after each
            - verbatim: "Then let me take it from here."
              delivery: a lift in energy, warm and sure
          avoid: a greeting before the first line, any word added to the lines

  - id: name
    speaker: relay
    plain: "Like a good chair for a meeting: it runs the agenda, answers what it can, and notices when people talk past each other."
    chunks:
      - id: name
        guide:
          intent: name the product as the answer to the hook, say what it does in a Zoom call, and the problem it is for
          seconds: 14
          beats:
            - verbatim: "I'm Alice, an On the Same Page facilitator built on Higgs Audio."
              delivery: bright, a small lift on the name
            - verbatim: "I join your Zoom call, I present, I answer, and then I listen."
              delivery: four quick steps, a light stress on the last one
            - verbatim: "Because too many meetings end in an agreement nobody checked against the documents."
              delivery: steady, a little dry, weight on nobody checked
          avoid: naming any real team or meeting

  - id: present
    speaker: relay
    plain: "Like a presenter with an earpiece: it keeps to the script, takes a question, and finds its place again."
    chunks:
      - id: one-session
        fragment: 1
        guide:
          intent: show Higgs Realtime as the live performer, and the script as Claude's, written before the meeting
          seconds: 9
          beats:
            - verbatim: "Here's how."
              delivery: brighter, a short pause after it
            - verbatim: "One Higgs Realtime session runs the whole meeting, one talking point at a time, from a script Claude wrote beforehand."
              delivery: clear and confident
      - id: interrupt
        fragment: 2
        guide:
          intent: promise the interruption, the cited answer and the resume, right before someone tests it
          seconds: 9
          beats:
            - verbatim: "Interrupt me, and I stop mid-sentence."
              delivery: crisp, a tiny pause after it
            - verbatim: "I look the answer up, show you the source, and pick up where I was cut."
              delivery: brisk, one breath
          # the demo's interruption lands about a second and a half into this point (Alice in demo.yaml; Ken in
          # run_of_show_people.md): the prepared line finishes the promise, now kept
          resume:
            verbatim: "As I was saying, I stop, look it up, show you the source, and pick up right where I left off. Just like that."
            delivery: brisk, a small smile on the last three words

  - id: listen
    speaker: relay
    plain: "Like a note taker who also knows the files: quiet, until the notes and the files disagree."
    chunks:
      - id: listen
        guide:
          intent: open the second half, listening; say who does what, the three kinds of issue, and the restraint
          seconds: 17
          beats:
            - verbatim: "When the slides end, I listen."
              delivery: calm and clear
            - verbatim: "Higgs transcribes every line, and Claude checks each one for a conflict with the documents, a hidden disagreement, or a detail nobody settled."
              delivery: count the three kinds off evenly
            - verbatim: "Before you confirm a plan like that, I ask one neutral question."
              delivery: calm, weight on before you confirm

  - id: achieved
    speaker: relay
    plain: "Like a project's status report: what works, how far it was tested, and what it can't do yet, on one page."
    chunks:
      - id: achieved
        fragment: 1
        guide:
          intent: say what works today, and how it was tested, without overclaiming real people
          seconds: 14
          delivery: confident and brisk
          beats:
            - verbatim: "Here's what works so far."
              delivery: plain, a short pause after it
            - verbatim: "I join real Zoom calls as my own participant, and present Claude's script word for word."
            - verbatim: "And with recorded participants, I've taken interruptions, answered from the documents, and flagged a plan that contradicted them."
              delivery: a light stress on recorded participants, then each item
      - id: limits
        fragment: 2
        guide:
          intent: say plainly where it does not work yet, without apology, and warn the room about the pause before it asks
          seconds: 14
          delivery: plain, no apology
          beats:
            - verbatim: "Now, my limits."
              delivery: plain, a brief pause after it
            - verbatim: "In one room, a shared microphone needs echo cancellation."
            - verbatim: "I read speaker names off Zoom's web page, so one can be wrong."
            - verbatim: "And Claude's check takes a few seconds, and it can miss one."
              delivery: lighter, an open ending

  - id: discussion
    speaker: human

# The hand-over to the discussion (its own response after the last talking point).
handover:
  intent: give the floor to the call with the question on the screen
  seconds: 8
  beats:
    - verbatim: "That's the project. Now it's your turn."
      delivery: warm, a brief pause after it
    - verbatim: "How do the judges ask their questions in Zoom, and who briefs them?"
      delivery: an open, inviting question
