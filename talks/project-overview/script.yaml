# On the Same Page presents itself to the hackathon room (D88). Claude wrote this script before the meeting; Higgs
# Realtime performs it live, one talking point per response. Every talking point has a `guide`: its job for the
# listener (intent), its beats (verbatim lines that must land exactly, or a gist with key phrases), delivery, length,
# what to avoid, and, where a cut is staged, the prepared `resume` line that picks it up. A `bridge` is the performer's
# own words, so it goes only before a gist: a point that opens word for word has its bridge written into its line.
# `say` is the Higgs TTS 3 backup line (what plays when the link is down); it is left out where every beat is
# verbatim, and the beats joined are then the backup.
#
# Spoken rules for every line, live or backup: numbers as words; no source ids, URLs or acronyms read aloud ("text to
# speech", never TTS; "Boson AI" is the one exception, a name); every line stays true while the backup plays it (the
# answers, lookups, checks and notes are live either way; never "what you hear is live"). Pause and pace come from
# punctuation and the delivery notes: there is no SSML. Facts: talks/project-overview/sources/ and doc/gotchas.md.
# Length: ~280 words presented at ~2.6 words a second (the guides' seconds add up to ~2 minutes); if the first live
# run is long, run_of_show.md lists what to cut first.
talk: project-overview
voice: default
presenter: Alice
slides:
  - id: hook
    speaker: relay
    plain: "Like the first minute of a pitch: put the room inside the story before the product has a name."
    chunks:
      - id: hook
        say: "Imagine you're an engineer, up since yesterday morning, building a hackathon project for Boson AI. Feature after feature, bug after bug, one more take of the demo. In an hour, you present it to a tired room. Frustrated? Nervous? Then let me take it from here."
        guide:
          intent: put the tired room inside the story, so the problem is theirs before the product has a name
          seconds: 25
          delivery: a storyteller, close and unhurried; the lines carry the pauses
          beats:
            - verbatim: "Imagine you're an engineer, up since yesterday morning, building a hackathon project for Boson AI."
              delivery: slow and warm, like the start of a story
            - verbatim: "Feature after feature, bug after bug, one more take of the demo."
              delivery: quicker, a light stress on each item
            - verbatim: "And in an hour, you present it, to a room as tired as you are."
              delivery: slower again, then a short silence
            - verbatim: "Are you frustrated? Nervous? Dreading the one question you can't answer?"
              delivery: three short questions, a pause after each
            - verbatim: "Then let me take it from here."
              delivery: a lift in energy, warm and sure
          avoid: a greeting before the first line, any word added to the lines

  - id: name
    speaker: relay
    plain: "Like a good chair for a meeting: it runs the agenda, answers what it can, and notices when people talk past each other."
    chunks:
      - id: name
        guide:
          intent: name the product as the answer to the hook, and promise what it does
          seconds: 9
          beats:
            - verbatim: "I'm On the Same Page, a meeting facilitator built on Higgs Audio."
              delivery: bright, a small lift on the name
            - verbatim: "I join your Zoom calls, I present, I answer, and then I listen."
              delivery: four steady steps, slowing on the last one

  - id: problem
    speaker: relay
    plain: "Like a group dinner where everyone agrees on the restaurant, and nobody checks it is closed on Mondays."
    chunks:
      - id: nods
        fragment: 1
        guide:
          intent: turn from presenting to the harder half, the discussion, where tired agreement comes cheap
          seconds: 6
          beats:
            - verbatim: "Because the hard part comes after the slides."
              delivery: lower and slower
            - verbatim: "A tired room nods along. Everyone agrees."
              delivery: two short sentences, a little dry
      - id: apparent
        fragment: 2
        guide:
          intent: land the problem in one line the room will remember, a callback to the product's name
          seconds: 9
          beats:
            - verbatim: "And the plan they agree on contradicts the documents nobody opened."
              delivery: steady, weight on contradicts
            - verbatim: "So the meeting ends in agreement, and nobody is on the same page."
              delivery: quiet, like a punchline, then a pause
          avoid: naming any real team or meeting

  - id: present
    speaker: relay
    plain: "Like a presenter with an earpiece: it keeps to the script, takes a question, and finds its place again."
    chunks:
      - id: one-session
        fragment: 1
        guide:
          intent: show Higgs Realtime as the live performer, and the script as Claude's, written before the meeting
          seconds: 9
          beats:
            - verbatim: "Here's how."
              delivery: brighter, a short pause after it
            - verbatim: "One Higgs Realtime session runs the whole meeting, one talking point at a time, from a script Claude wrote beforehand."
              delivery: clear and confident
      - id: interrupt
        fragment: 2
        guide:
          intent: promise the interruption, the cited answer and the resume, right before someone tests it
          seconds: 9
          beats:
            - verbatim: "Interrupt me, and I stop mid-sentence."
              delivery: crisp, a tiny pause after it
            - verbatim: "I look the answer up, show you the source, and pick up where I was cut."
              delivery: brisk, one breath
          # the demo's interruption lands about a second and a half into this point (Alice, run_of_show.md): the
          # prepared line finishes the promise, now kept
          resume:
            verbatim: "As I was saying, I stop, look it up, show you the source, and pick up right where I left off. Just like that."
            delivery: brisk, a small smile on the last three words

  - id: listen
    speaker: relay
    plain: "Like a note taker who also knows the files: quiet, until the notes and the files disagree."
    chunks:
      - id: listen
        guide:
          intent: open the second half, listening; say who does what, the three kinds of issue, and the restraint
          seconds: 17
          beats:
            - verbatim: "When the slides end, I listen."
              delivery: slower and calmer
            - verbatim: "Higgs transcribes every line, and Claude checks each one for a conflict with the documents, a hidden disagreement, or a detail nobody settled."
              delivery: count the three kinds off evenly
            - verbatim: "Before you confirm a plan like that, I ask one neutral question."
              delivery: calm, weight on before you confirm

  - id: results
    speaker: relay
    plain: "Like a lab notebook: what ran for real, and what the stopwatch said."
    chunks:
      - id: measured
        guide:
          intent: prove it is real, with two measured facts the room can hold on to
          seconds: 14
          delivery: confident; slow down on the numbers
          beats:
            - verbatim: "Every answer, lookup, check and note is live."
              delivery: a light stress on each item
            - verbatim: "With recorded participants, I start answering about seven tenths of a second after they stop."
            - verbatim: "And two earlier test meetings passed all eight of our checks."

  - id: limits
    speaker: relay
    plain: "Like the small print, read out loud for once."
    chunks:
      - id: limits-scope
        fragment: 1
        guide:
          intent: say plainly where it does not work yet, without apology
          seconds: 6
          beats:
            - verbatim: "Now, my limits."
              delivery: plain and slower, a short pause after it
            - verbatim: "I'm built for online meetings, and for now I speak English only."
      - id: limits-check
        fragment: 2
        guide:
          intent: be honest about the check, with its measured score, and warn the room about the pause before it asks
          seconds: 9
          delivery: plain, no apology
          beats:
            - verbatim: "Claude's check got forty-seven of fifty-three test lines right, so it can miss one."
            - verbatim: "And it takes a few seconds before I ask."

  - id: discussion
    speaker: human

# The hand-over to the discussion (its own response after the last talking point).
handover:
  intent: give the floor to the room with the question on the screen
  seconds: 8
  beats:
    - verbatim: "That's the project. Now it's your turn."
      delivery: warm, a pause after it
    - verbatim: "How do we run the demo with real people, and who sets it up?"
      delivery: an open, inviting question
