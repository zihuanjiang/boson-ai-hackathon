# The legacy regex check (`--alignment legacy` only; the default is Claude's check, which needs none of this).
# One slot: how people put their questions to the facilitator in Zoom. The sources establish `speak_up` (ZOOM-2:
# "people just speak up"); ZOOM-3 names the chat and raised hands only as what it never sees ("never sees raised hands
# or the chat"), which the `chat` and `raise_hand` patterns don't match: they need a verb ("type their questions in
# the Zoom chat", "raise a hand"). The discussion's planned conflict is the chat plan (demo.yaml: Bob;
# run_of_show_people.md: the Partner); a raised-hand plan is caught the same way.
slots:
  - id: zoom_questions
    label: "How people put questions to the facilitator in Zoom"
    context: ['\bzoom\b', '\bchat\b', '\bhands?\b', '\binterrupt', '\bcalled on\b', '\bjust (speak|talk)\b', '\bspeak up\b']
    values:
      speak_up: ['\bspeak(s|ing)? up\b', '\bjust (speak|talk)\b']
      chat: ['\b(type|types|typing|typed|post|posts|posting|write|writes|writing|put|puts|drop|drops|send|sends)\b[^.?!;]{0,40}\b(in|into|on|to|through|via) the (zoom )?chat\b',
             '\b(use|uses|using) the (zoom )?chat\b']
      raise_hand: ['\b(raise|raises|raising) (a |their |your |his |her |our )?hands?\b', '\bput (a |their |your )?hands? up\b']
actions: ['\bi''ll\b', '\bi will\b', '\blet''s\b', '\btell\b', '\bbrief', '\bask (everyone|people|the judges)\b', '\bhave (them|the judges|everyone)\b']
# real people word it their own way: "Okay, let's go with that." confirms; "Ken handles the briefing" names the owner
confirmations: ['\bsounds good\b', '\block (that|it) in\b', '\bfinali[sz]e\b', '\bagreed\b', '\bgo with (that|it)\b']
ownership: ['\bowns?\b', '\bwill brief\b', '\bbriefs\b', '\bhandles?\b', '\byou brief\b']
window_utterances: 3
