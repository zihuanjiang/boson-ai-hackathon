# Relay introduces itself: the stage talk (brief §13, Appendix A). Claude drafted it; Ken owns every spoken line.
#   validate: uv run python -m relay.talk talks/relay-intro     render: uv run python -m relay.render talks/relay-intro
# The `say` lines do two jobs (D52, D53). They are Relay's notes: Higgs Realtime presents each slide live from them,
# in its own words. They are also the backup narration: TTS 3 renders them word for word, and the backup plays a
# slide when live narration can't (the network dropped). So they must read well aloud, and every claim must hold
# for both. `fragment` reveals apply to the backup only: a live slide shows all its fragments at once.
# Narration rules: whole sentences, at most 300 characters per `say` (tags included), numbers spelled as words,
# no digits, URLs, parentheses or acronyms. Delivery tags only at the start of a chunk; <|prosody:pause|> anywhere.
# Tags shape only the backup (the live notes go to the model without them).
# `plain` is the seed for a live plain-language re-explanation; Relay never reads it out as narration.
# CUE comments mark where Ken taps for the live cut-ins. Relay words every slide differently on each run, so the
# cues name a topic, not a word; the exact lines are in run_of_show.md.
talk: relay-intro
voice: default        # D54: never voice-validated per session, lowest latency; re-render after any change
presenter: Ken
slides:
  - id: title
    speaker: human    # Ken's hook. He taps Space: "...so I built a co-presenter. Relay, take it away." -> start_presentation
                      # (if Relay greets but calls no tool, the opening watchdog starts it after 1.5 s: ticker `auto`)

  - id: problem
    speaker: relay
    plain: "Like a brilliant chef who freezes the moment a guest asks what is in the dish."
    chunks:
      - say: "Here's a pattern you've all seen. An engineer spends three months building something brilliant, then gets five minutes on demo day to explain it."
        fragment: 1
      # CUE (a): Ken taps while Relay paints the demo-day nerves (the lights, the quiet room, the nervous tour of
      # the code): "Quick comment: that was literally my last demo day." -> resume_script (or the watchdog). Relay
      # carries on from what the room last heard, so "The work was brilliant. The five minutes were not." can
      # still land on Ken.
      - say: "The lights come up, and the room goes quiet. The idea that felt so clear at two in the morning comes out as a nervous tour of the code. The work was brilliant. The five minutes were not."
        fragment: 2
      - say: "Coding agents can already write the slides and the script. One of them drafted this talk. But someone still has to stand up and deliver it. <|prosody:pause|> This time, that someone is me."
        fragment: 3

  - id: idea
    speaker: relay
    plain: "Like a radio co-host: you plan the show, it carries the segment and takes the calls, and you can grab the mic back anytime."
    chunks:
      - say: "So here's the idea. Give me the slides and a few notes, then hand me the stage. I'll present it live, in my own words and one consistent voice, and yes, you're allowed to interrupt me."
        fragment: 1
      - say: "Cut in with a comment, and I'll answer and find my place again. Ask for the simple version, and I'll reach for an everyday picture. Ask a question, and I'll answer from the facts I was given."
        fragment: 2
      - say: "And when it's time, I hand the floor back. The human stays in charge: one tap, and I stop mid-word. <|prosody:pause|> Most keynote speakers can't promise that."
        fragment: 3

  - id: how
    speaker: relay
    plain: "Think of me as a talk show host with cue cards and an earpiece: the cards say what to cover, the earpiece lets Ken cut in anytime, and I always know the last thing you heard, so I pick up right there."
    chunks:
      # The first chunk names the backup, so it stays true when the backup itself is playing.
      - say: "How does it work? Each slide comes with a few notes, and I present them live, in my own words, through one warm Higgs Realtime session. If the network drops, you hear a backup instead, rendered ahead of time by Higgs text to speech."
        fragment: 1
      # CUE (friend): Ken taps as Relay starts on what a tap does (its audio stops, the browser counts what the room
      # heard) and points: "Sorry, can you explain that like I'm not an engineer?" -> metaphor from `plain`, "As I
      # was saying..." -> Relay finishes the slide from where the room stopped hearing it: the mic, the answer, the
      # tool call and the pick-up, which is exactly what just happened.
      - say: "Ken holds the floor control. One tap stops my audio at once, and the browser counts how much of my voice the room actually heard. I trim my memory of what I said to match, so I never remember saying something nobody heard."
        fragment: 2
      - say: "Then the microphone opens, and semantic turn detection hears when you've finished. I answer in the same voice, call a tool that drives this deck, and pick up right where you stopped hearing me."
        fragment: 3

  - id: details
    speaker: relay
    plain: "Like a stage manager with a clipboard: always knows who has the floor, never moves the set while someone is mid-line, and keeps a spare headset ready."
    # Dense on purpose, and the slide shows everything at once (no fragments), so skipping it feels natural.
    chunks:
      # CUE (b): Ken taps once Relay is into the jargon (the five states, turn detection): "That's a lot of
      # detail. Let's skip to the demo." -> goto_slide demo.
      - say: "Under the hood, I'm a state machine with five states: idle, narrating, paused, listening, and replying. A tap moves me to listening, and semantic voice activity detection ends your turn when your thought sounds finished, not just when you pause."
      - say: "Each slide is one live response in the same conversation, with its notes as instructions and my tools switched off. If a slide doesn't start in time, I ask once more, then play the backup."
      # If nobody cuts in (rehearsal), the last line still bridges into the demo.
      - say: "Tool calls wait until the playback buffer drains, and a watchdog steps in if I forget one. If the socket drops, I reconnect and re-send my voice, tools and place in under two seconds. <|prosody:pause|> If your eyes just glazed over, that's exactly what interruptions are for."

  - id: demo
    speaker: relay
    plain: "Like a live cooking show: the recipe was written ahead of time, but every dish you tasted was cooked right in front of you."
    chunks:
      # Points back at the three live moments: cut-in (a), the friend's plain-language cut-in, cut-in (b).
      - say: "<|emotion:enthusiasm|>You've been watching the demo all along. When Ken cut in, I stopped at once, answered him, and picked up right after the last thing you heard, without starting the slide over."
        fragment: 1
      - say: "Nobody recorded that plain-language answer. Higgs Realtime made it on the spot, inside the same conversation I present in, so you never hear a seam between presenting and answering. That's the point."
        fragment: 2
      - say: "When Ken asked to skip ahead, I didn't just agree. I called a tool and moved the deck myself. Every call shows up on screen, so you can check my work, even when a watchdog had to make it for me."
        fragment: 3

  - id: qa
    speaker: relay
    mode: qa          # after this slide Relay waits (IDLE); Ken taps for the planted question
    plain: "Like a bookmark that marks the last line you actually read, so you pick up right there, without rereading or skipping a page."
    chunks:
      - say: "Now for the part nobody can script. I'd love to take a question."

  - id: higgs
    speaker: human    # Ken: Built on Higgs (talking points in run_of_show.md)
  - id: limits
    speaker: human    # Ken: known limitations
  - id: thanks
    speaker: human    # Ken: what's next, team, repo, thanks
