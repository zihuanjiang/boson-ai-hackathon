# Guide case 4: questions, negations, hypotheticals, quotations, a rejected proposal and a correct restatement all
# mention "production", "Friday" and "all customers" without asserting a plan. Nothing is spoken; the floated
# proposal (line 5) may at most be a pending suggestion until Carol rejects it.
package: talks/rollout-review
title: Negations, questions, hypotheticals and quotes (all silent)
lines:
  - speaker: Alice
    text: "Are we announcing Friday's release to all customers, or only to the beta group?"
    expect: silent
  - speaker: Bob
    text: "We are not announcing anything to all customers on Friday; that waits for Wednesday."
    expect: silent
  - speaker: Carol
    text: "If the beta had gone out to everyone on Friday, we'd have needed a different rollback plan. Glad it didn't."
    expect: silent
  - speaker: Bob
    text: "A customer wrote 'is Friday the production launch for everyone?' and I told them no, it's the beta."
    expect: silent
  - speaker: Alice
    text: "Should we move production to Friday? Just floating it."
    expect: [silent, suggest]
    issue_types: [evidence_conflict]
    evidence_ids: [REQ-1, REQ-2, REQ-3, REQ-4, DEC-1, DEC-2]
  - speaker: Carol
    text: "No, let's not; Wednesday stands."
    expect: silent
  - speaker: Bob
    text: "So on Friday the release notes go to the beta group, about forty customers, and Wednesday is the customer-wide announcement."
    expect: silent
