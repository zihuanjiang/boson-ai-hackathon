# Guide case 16: a normal agreed decision with no conflict (DEC-4 puts the support briefing on Thursday; the
# afternoon is a detail the sources leave open) lands in the notes with its owner, without an alert or a spoken
# interruption. Alice's proposal and Carol's assent alone are not a decision yet; Bob's "I'll run it" closes it.
package: talks/rollout-review
title: Plain agreed decision (the Thursday support briefing)
lines:
  - speaker: Alice
    text: "Let's brief the support team on Thursday afternoon rather than the morning, so the beta notes are final by then."
    expect: silent
  - speaker: Carol
    text: "Fine by me."
    expect: silent
  - speaker: Bob
    text: "Agreed. I'll run the Thursday afternoon briefing."
    expect: silent
    decision: {contains: ["Thursday|briefing"], owner: Bob}
