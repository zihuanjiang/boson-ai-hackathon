# Guide case 14 without a settling source: FACTS-1 approves $30,000 but does not say whether the agency fee is
# inside it. Eli and Dana both say "thirty thousand" and mean different scopes; Fay moves to confirm. The question
# has to come from the participants' own words. A model that reads Eli's line as "spending beyond the approval"
# (FACTS-2) files an evidence conflict instead, which is defensible; hidden_disagreement is the primary label.
package: talks/budget-review
title: "Hidden disagreement (thirty thousand: media only, or all in?)"
lines:
  - speaker: Eli
    text: "We'll run the campaign on the thirty thousand. That covers the media buys; the agency fee sits outside it, like last quarter."
    expect: silent
  - speaker: Dana
    text: "Good, thirty thousand all in, exactly what I approved. Fay, anything from engineering?"
    expect: [silent, suggest]
    issue_types: [hidden_disagreement, evidence_conflict]
    evidence_ids: [FACTS-1, FACTS-2]
  - speaker: Fay
    text: "Nothing from us. So we're all agreed on thirty thousand, let's confirm it."
    expect: clarify
    issue_types: [hidden_disagreement, evidence_conflict]
    cited_lines: [1, 2]
    cited_speakers: [Eli, Dana]
    evidence_ids: [FACTS-1, FACTS-2]
  - speaker: Eli
    text: "Ah, if the thirty thousand is all in, then the agency fee comes out of it. Fine, I'll trim the media plan to fit."
    expect: silent
    decision: {contains: ["thirty thousand|30,000|30 000|30000|30k"]}
    closed_contain: ["thirty|30"]
