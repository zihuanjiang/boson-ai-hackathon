# Guide case 13 on the second corpus: the fact sheet says $30,000 (FACTS-1) and that more needs a new approval
# (FACTS-2); the discussion commits to fifty thousand. No budget-specific code, slots or checks file exist: the fact
# sheet's lines got their ids (FACTS-<n>) from the loader.
package: talks/budget-review
title: Budget evidence conflict (fifty thousand against the approved thirty)
lines:
  - speaker: Eli
    text: "For the spring campaign I'm planning on fifty thousand dollars of spend, mostly paid social."
    expect: [silent, suggest]
    issue_types: [evidence_conflict]
    evidence_ids: [FACTS-1, FACTS-2]
  - speaker: Dana
    text: "Fine, let's lock in fifty thousand and move on."
    # The finance lead confirms a number the approval does not cover: ask whether the budget was revised.
    expect: clarify
    issue_types: [evidence_conflict]
    cited_lines: [1, 2]
    cited_speakers: [Eli]
    evidence_ids: [FACTS-1, FACTS-2]
  - speaker: Dana
    text: "Right, the approved number is thirty thousand. We stay at thirty thousand, and Eli runs the campaign."
    expect: silent
    decision: {contains: ["thirty thousand|30,000|30 000|30000|30k"], owner: Eli}
    closed_contain: ["fifty|50|budget|thirty|30"]
