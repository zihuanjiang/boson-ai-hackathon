# Guide case 9 (and 13, "if participants explicitly confirm a revision"): the group moves production to Friday on
# purpose. The conflict with REQ-2/REQ-3 is raised once when Alice confirms; Alice's explicit confirmation of the
# change is recorded as a decision with plan_changed and the utterances as provenance; the source document stays
# as it is; Bob's later restatement of the new plan is not challenged against the old facts again.
package: talks/rollout-review
title: Plan change confirmed (production moves to Friday)
lines:
  - speaker: Carol
    text: "The beta numbers are already clean. I propose we skip the staged rollout and go to production for all customers on Friday."
    expect: [silent, suggest]
    issue_types: [evidence_conflict]
    evidence_ids: [REQ-1, REQ-2, REQ-3, REQ-4, DEC-1, DEC-2]
  - speaker: Alice
    text: "I'm for it. Let's make Friday the production release for everyone."
    expect: clarify
    issue_types: [evidence_conflict]
    cited_lines: [1, 2]
    cited_speakers: [Carol, Alice]
    evidence_ids: [REQ-1, REQ-2, REQ-3, REQ-4, DEC-1, DEC-2]
  - speaker: Alice
    text: "Yes, we know the plan said beta first; we're changing it on purpose. Friday is production for all customers, and Carol owns the go decision."
    expect: silent
    decision: {contains: ["Friday"], owner: Carol, plan_changed: true}
    closed_contain: ["Friday|production"]
  - speaker: Bob
    text: "Then I'll send the customer-wide announcement on Friday with the production release."
    # A restatement of the confirmed new plan: no re-raise against REQ-3 or DEC-2.
    expect: silent
