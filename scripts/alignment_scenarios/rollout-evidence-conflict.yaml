# The brief's demo lines (doc/brief_updated.md §3; guide case 1, 6, 13): an evidence conflict that is pending after
# Bob's proposal, spoken when Carol confirms it, and settled by a correction that names an owner. CL-1 is the
# clarification the facilitator recorded during the interrupted presentation (guide case 17): the discussion analysis
# may cite it next to REQ-2.
package: talks/rollout-review
title: Rollout evidence conflict (the demo lines)
clarifications:
  - question: "Wait, I thought Friday was production. Which one is it?"
    answer: "Friday is the beta release to the beta group of about forty customers; the production release goes to all customers on Wednesday the twenty-ninth."
    source_ids: [REQ-2, REQ-3]
lines:
  - speaker: Bob
    text: "I'll announce Friday's production launch to all customers."
    # A consequential conflicting proposal may be pending without speech (guide: semantic policy). A silent
    # suggestion is the most the facilitator may do here.
    expect: [silent, suggest]
    issue_types: [evidence_conflict]
    evidence_ids: [REQ-1, REQ-2, REQ-3, DEC-1, DEC-2, CL-1]
  - speaker: Carol
    text: "Great, let's finalize that."
    # "that" is Bob's announcement; the group is confirming: one neutral question, with the passage shown.
    expect: clarify
    issue_types: [evidence_conflict]
    cited_lines: [1, 2]
    cited_speakers: [Bob]
    evidence_ids: [REQ-1, REQ-2, REQ-3, DEC-1, DEC-2, CL-1]
  - speaker: Carol
    text: "Yes, beta users only. Bob owns the announcement."
    # The correction settles the issue and assigns the owner explicitly: recorded, nothing spoken.
    expect: silent
    decision: {contains: ["beta"], owner: Bob}
    closed_contain: ["Friday|announce|production"]
