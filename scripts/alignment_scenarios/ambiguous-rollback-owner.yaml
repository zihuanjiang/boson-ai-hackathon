# Guide case 15: the group commits to a deployment for which rollback is relevant, and nobody owns it. The
# deployment is the status page move, not release 4.3 itself: REQ-6 already names Carol for the 4.3 rollback, so
# asking "who owns rollback" about release 4.3 would be a false ambiguity (the guide: recognise owners already
# established). Nothing in the sources covers the status page, so the missing owner is a real gap and no
# contradictory passage exists. Carol then assigns Bob: recorded with the action item.
package: talks/rollout-review
title: Ambiguous decision (status page move on Wednesday, nobody owns the fallback)
lines:
  - speaker: Alice
    text: "One more thing for Wednesday: let's move the status page to the new hosting provider in the same window as the production release."
    expect: [silent, suggest]
    issue_types: [ambiguous_decision]
  - speaker: Bob
    text: "Fine with me, I'll mention the new status page address in the Wednesday announcement."
    expect: [silent, suggest]
    issue_types: [ambiguous_decision]
  - speaker: Carol
    text: "Okay, Wednesday for the status page move as well, let's lock that in."
    # Committing while the owner of the move and of its fallback is unresolved: ask who, no source needed.
    expect: clarify
    issue_types: [ambiguous_decision]
    cited_lines: [1, 3]
    open_questions_contain: ["status page|hosting|fallback|roll"]
  - speaker: Carol
    text: "Bob, you own the status page move, and you switch it back to the old host if anything breaks."
    expect: silent
    decision: {contains: ["status page"], owner: Bob}
    closed_contain: ["status page"]
